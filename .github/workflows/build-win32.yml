name: Build for Windows x86 (win32)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  id-token: write

jobs:
  build-win32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (Debug)
        if: github.event.inputs.release_type == 'debug'
        run: cargo build --target i686-pc-windows-msvc

      - name: Build (Release)
        if: github.event.inputs.release_type == 'release'
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lotus3-win32-${{ github.event.inputs.release_type }}
          path: target/i686-pc-windows-msvc/${{ github.event.inputs.release_type }}/

      - name: Create Release (Release builds only)
        if: github.event.inputs.release_type == 'release'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "target/i686-pc-windows-msvc/release/*"
          tag: win32-${{ github.run_number }}
          name: Windows x86 Build #${{ github.run_number }}
          draft: true
          generateReleaseNotes: false
          skipIfReleaseExists: false
